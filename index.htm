<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paleta de cores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>paleta de cores</h1>

    <div id="tela-de-pintura"></div>

    <h3></h3>

    <p>clique em uma das cores abaixo para pintar a tela</p>

    <div id="paleta">
        <div id="pincel-azul" class="pincel" style="background-color: blue;"></div>
        <div id="pincel-roxo" class="pincel" style="background-color: purple;"></div>
        <div id="pincel-vinho" class="pincel" style="background-color: #800020;"></div>
        <div id="pincel-vermelho" class="pincel" style="background-color: red;"></div>
        <div id="pincel-dourado" class="pincel" style="background-color: #D4AF37;"></div>
        <div id="pincel-verde" class="pincel" style="background-color: #708238;"></div>
        <div id="pincel-laranja" class="pincel" style="background-color: #CC5500;"></div>
        <div id="pincel-coral" class="pincel" style="background-color: #FF7F50;"></div>
        <div id="pincel-azulp" class="pincel" style="background-color: #005F6B;"></div>
    </div>

    <script src=".js"></script>

</body>
</html>
